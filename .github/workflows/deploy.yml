name: Deploy to cPanel

on:
  push:
    branches:
      - main        # change to your branch

jobs:
  deploy-cpanel1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Deploy to cPanel 1
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.CPANEL1_HOST }}
          username: ${{ secrets.CPANEL1_USERNAME }}
          password: ${{ secrets.CPANEL1_PASSWORD }}
          local-dir: ./
          server-dir: ${{ secrets.CPANEL1_PATH }}
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.ftp-deploy-sync-state.json

  deploy-cpanel2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Deploy to cPanel 2
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.CPANEL2_HOST }}
          username: ${{ secrets.CPANEL2_USERNAME }}
          password: ${{ secrets.CPANEL2_PASSWORD }}
          local-dir: ./
          server-dir: ${{ secrets.CPANEL2_PATH }}
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.ftp-deploy-sync-state.json